<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serval Socket.IO sample</title>
    <link rel="stylesheet" href="/socketio/site.css">
    <script src="/socketio/socket.io.min.js" defer></script>
    <script src="/socketio/client.js" defer></script>
</head>
<body>
<main>
    <h1>Socket.IO with Serval</h1>
    <p>Open this page in two tabs, join the same room, and send a message. Each namespace has its own rooms.</p>
    <form id="connection">
        <label>Namespace <select id="namespace"><option value="/chat">/chat</option><option value="/">/</option></select></label>
        <label>Transport <select id="transport"><option value="upgrade">Polling, then WebSocket</option><option value="polling">Polling only</option><option value="websocket">WebSocket only</option></select></label>
        <button id="connect">Connect</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
    </form>
    <p id="status" role="status">Disconnected</p>
    <form id="join">
        <label>Room <input id="room" value="lobby" maxlength="64" required></label>
        <button class="online" disabled>Join room</button>
    </form>
    <form id="chat">
        <label>Message <input id="message" maxlength="1000" required placeholder="Hello from Serval"></label>
        <button class="online" disabled>Send</button>
    </form>
    <p>
        <button id="binary" class="online" disabled>Echo UTF-8 binary</button>
        <button id="question" class="online" disabled>Answer a server question</button>
    </p>
    <p>The client reconnects after network interruptions. Join your room again after reconnecting. Message history is not replayed.</p>
    <ol id="log" aria-label="Connection and message log" aria-live="polite"></ol>
</main>
</body>
</html>
